[project]
name = "mtda-pomodoro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mateogt", email = "tejerinamateo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flet>=1.0.4",
    "peewee>=4.5.3",
    "platformdirs>=4.13.0",
    "ruff>=0.17.0",
]

[project.scripts]
mtda-pomodoro = "mtda_pomodoro:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.4.1",
    "pytest>=9.1.1",
]
